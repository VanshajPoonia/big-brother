[project]
name = "bigbrother"
version = "0.1.0"
description = "Checks the claims in issues and pull requests against the code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bigbrother = "bigbrother.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bigbrother"]

[tool.pytest.ini_options]
testpaths = ["tests"]
